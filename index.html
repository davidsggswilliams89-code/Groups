<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WhatsGroups — Premium WhatsApp Groups</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f8;color:#182126}.container{width:min(1100px,94%);margin:auto}.top{background:#075e54;color:#fff;padding:17px 0}.brand{font-size:24px;font-weight:900}.hero{background:linear-gradient(135deg,#075e54,#128c7e);color:#fff;padding:34px 0}.hero h1{margin:0 0 9px;font-size:31px}.hero p{margin:0;opacity:.93}.section{padding:28px 0}.grid{display:grid;gap:18px}.group-card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.08)}.group-img{width:100%;height:210px;object-fit:cover;background:#ddd}.card-body{padding:18px}.group-name{font-size:21px;font-weight:800;margin:0 0 8px}.price{font-size:24px;font-weight:900;color:#075e54;margin-bottom:14px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ccd8d6;border-radius:9px;font-size:15px}.bank-box{background:#f1f8f6;border-radius:12px;padding:13px;margin-bottom:15px;font-size:14px;line-height:1.7}.bank-box strong{display:inline-block;min-width:105px}.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:800;cursor:pointer;width:100%;margin-top:10px}.btn-primary{background:#075e54;color:#fff}.btn-secondary{background:#e7f2ef;color:#075e54}.btn-danger{background:#ffe7e7;color:#a30000}.status{padding:11px;border-radius:9px;margin-top:12px;font-size:14px;display:none}.success{display:block;background:#e6f7ec;color:#176b35}.error{display:block;background:#ffe9e9;color:#a00000}.info{display:block;background:#e9f3ff;color:#155a9b}.empty{text-align:center;padding:45px;background:#fff;border-radius:16px;color:#667}.admin-btn{position:fixed;right:15px;bottom:15px;border:0;border-radius:50%;width:54px;height:54px;background:#075e54;color:#fff;font-size:20px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;z-index:10}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow:auto;padding:20px}.modal-box{background:#fff;width:min(900px,100%);margin:20px auto;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#eee;border-radius:8px;padding:8px 12px;cursor:pointer}.admin-grid{display:grid;gap:18px}.admin-card{border:1px solid #e1e7e6;border-radius:14px;padding:15px}.admin-card h3{margin-top:0}.payment{border-top:1px solid #e5e5e5;padding:12px 0}.payment:first-child{border-top:0}.small{font-size:13px;color:#667}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{width:auto;flex:1;min-width:120px}.locked{background:#fff7dd;color:#785500;padding:10px;border-radius:9px;font-size:13px;margin-top:10px}.receipt{margin-top:10px}.receipt img{width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#fafafa}.hidden{display:none!important}.paybox{background:#f7faf9;border:1px solid #dce9e6;padding:14px;border-radius:12px;margin-top:12px}.linkbox{background:#e8f8ed;border:1px solid #a9d8b6;border-radius:12px;padding:14px;margin-top:12px}.linkbox a{display:block;margin-top:8px;font-weight:900;color:#075e54;word-break:break-all}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#eee}.tag.PAID{background:#dff5e6;color:#176b35}.tag.PENDING{background:#fff4cf;color:#7b5b00}.tag.FAILED,.tag.REVERSED,.tag.EXPIRED{background:#ffe3e3;color:#a00000}
@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr 1fr}.group-img{height:240px}}
</style>
</head>
<body>
<header class="top"><div class="container"><div class="brand">WhatsGroups</div></div></header>
<section class="hero"><div class="container"><h1>Join Premium WhatsApp Groups</h1><p>Pay securely through Monnify. Your access is released only after payment is verified.</p></div></section>
<main class="section"><div class="container"><h2>Available Groups</h2><div id="groupsGrid" class="grid"><div class="empty">Loading groups...</div></div></div></main>
<button class="admin-btn" id="adminOpen" title="Admin">⚙</button>
<div class="modal" id="adminModal"><div class="modal-box">
<div class="modal-head"><h2>Admin Panel</h2><button class="close" onclick="closeAdmin()">✕</button></div>
<div id="loginArea"><p class="small">Admin login uses Firebase Authentication.</p><div class="field"><label>Email</label><input id="adminEmail" type="email" placeholder="Admin email"></div><div class="field"><label>Password</label><input id="adminPassword" type="password" placeholder="Password"></div><button class="btn btn-primary" onclick="adminLogin()">Login</button><div id="loginStatus" class="status"></div></div>
<div id="adminArea" class="hidden">
<div class="admin-grid"><section class="admin-card"><h3 id="formTitle">Add Group</h3>
<div class="field"><label>Group name</label><input id="gName" placeholder="VIP Business Group"></div>
<div class="field"><label>Price (NGN)</label><input id="gPrice" type="number" min="1" placeholder="5000"></div>
<div class="field"><label>Bank name shown to customers</label><input id="gBank" placeholder="Moniepoint"></div>
<div class="field"><label>Account number shown to customers</label><input id="gAccount" placeholder="1234567890"></div>
<div class="field"><label>Account name shown to customers</label><input id="gAccountName" placeholder="Business Name"></div>
<div class="field"><label>WhatsApp invite link (protected)</label><input id="gWhatsapp" placeholder="https://chat.whatsapp.com/..." type="url"></div>
<div class="field"><label>Group image URL</label><input id="gImage" placeholder="https://...jpg"></div>
<div class="row"><button class="btn btn-primary" onclick="saveGroup()">Save Group</button><button class="btn btn-secondary" onclick="resetGroupForm()">Clear</button></div><div id="groupStatus" class="status"></div>
</section><section class="admin-card"><h3>Groups</h3><div id="adminGroups">Loading...</div></section></div>
<section class="admin-card" style="margin-top:18px"><h3>Payment Submissions</h3><div id="paymentsList">Loading...</div></section><button class="btn btn-danger" onclick="adminLogout()">Logout</button>
</div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,deleteDoc,getDoc,query,orderBy,serverTimestamp,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
const firebaseConfig={apiKey:"AIzaSyCNViGiBKcHy-B7WF2C2xJ6-qMfqPIzqGQ",authDomain:"groups-90d13.firebaseapp.com",projectId:"groups-90d13",storageBucket:"groups-90d13.firebasestorage.app",messagingSenderId:"1071009308351",appId:"1:1071009308351:web:48955d87b69bc359d4300a"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),functions=getFunctions(app,'us-central1');
const initPayment=httpsCallable(functions,'initializePayment'),verifyPayment=httpsCallable(functions,'verifyPayment'),getPaymentStatus=httpsCallable(functions,'getPaymentStatus');
let editingGroupId=null,groupsCache=[];
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function show(id,type,msg){const e=$(id);e.className='status '+type;e.textContent=msg;e.style.display='block'}
async function loadGroups(){const grid=$('groupsGrid');try{const snap=await getDocs(query(collection(db,'groups'),orderBy('createdAt','desc')));groupsCache=[];snap.forEach(d=>groupsCache.push({id:d.id,...d.data()}));if(!groupsCache.length){grid.innerHTML='<div class="empty">No groups available yet.</div>';return}grid.innerHTML=groupsCache.map(g=>`<article class="group-card"><img class="group-img" src="${esc(g.imageUrl||'')}" alt="${esc(g.name)}" onerror="this.style.display='none'"><div class="card-body"><h3 class="group-name">${esc(g.name)}</h3><div class="price">${money(g.price)}</div><div class="bank-box"><div><strong>Bank:</strong> ${esc(g.bankName)}</div><div><strong>Account:</strong> ${esc(g.accountNumber)}</div><div><strong>Name:</strong> ${esc(g.accountName)}</div></div><div class="field"><label>Your email</label><input id="email-${g.id}" type="email" placeholder="you@example.com"></div><button class="btn btn-primary" onclick="startPayment('${g.id}')">Pay ${money(g.price)} with Monnify</button><div id="pay-${g.id}"></div></div></article>`).join('')}catch(e){grid.innerHTML='<div class="empty">Could not load groups. Check Firebase Firestore setup.</div>';console.error(e)}}
window.startPayment=async function(groupId){const g=groupsCache.find(x=>x.id===groupId),email=$('email-'+groupId)?.value.trim();if(!g)return;if(!email||!email.includes('@')){show('pay-'+groupId,'error','Please enter a valid email address first.');return}const box=$('pay-'+groupId);box.innerHTML='<div class="status info" style="display:block">Creating secure payment...</div>';try{const r=await initPayment({groupId,email});const d=r.data;localStorage.setItem('wgPayment',JSON.stringify({paymentId:d.paymentId,accessToken:d.accessToken}));box.innerHTML=`<div class="paybox"><b>Payment created</b><div class="small">Reference: ${esc(d.paymentReference)}</div><button class="btn btn-primary" onclick="window.location.href='${esc(d.checkoutUrl)}'">Open Monnify Checkout</button><div class="small" style="margin-top:8px">After payment, return to this page. Your payment will be checked automatically.</div></div>`;pollPayment(d.paymentId,d.accessToken,groupId)}catch(e){box.innerHTML='<div class="status error" style="display:block">'+esc(e.message||'Could not start payment.')+'</div>'}};
async function pollPayment(paymentId,accessToken,groupId){let tries=0;const timer=setInterval(async()=>{tries++;try{const r=await getPaymentStatus({paymentId,accessToken});const p=r.data;if(p.status==='PAID'){clearInterval(timer);const box=$('pay-'+groupId);box.innerHTML=`<div class="linkbox"><b>Payment verified ✓</b><div>Your WhatsApp access is ready.</div><a href="${esc(p.whatsappLink)}" target="_blank" rel="noopener">Join WhatsApp Group</a></div>`}else if(['FAILED','REVERSED','EXPIRED'].includes(p.status)){clearInterval(timer);$('pay-'+groupId).innerHTML='<div class="status error" style="display:block">Payment status: '+esc(p.status)+'. Please start a new payment.</div>'}else{$('pay-'+groupId).innerHTML='<div class="status info" style="display:block">Payment status: '+esc(p.status||'PENDING')+'. Waiting for confirmation...</div>'}}catch(e){}if(tries>=60)clearInterval(timer)},5000)}
async function loadAdminGroups(){const el=$('adminGroups');try{const snap=await getDocs(query(collection(db,'groups'),orderBy('createdAt','desc')));el.innerHTML='';snap.forEach(d=>{const g=d.data();const div=document.createElement('div');div.className='payment';div.innerHTML=`<b>${esc(g.name)}</b><div class="small">${money(g.price)} · ${esc(g.bankName||'')}</div><div class="row"><button class="btn btn-secondary" onclick="editGroup('${d.id}')">Edit</button><button class="btn btn-danger" onclick="removeGroup('${d.id}')">Delete</button></div>`;el.appendChild(div)});if(!el.innerHTML)el.textContent='No groups yet.'}catch(e){el.textContent='Could not load groups.'}}
window.editGroup=async id=>{const d=await getDoc(doc(db,'groups',id)),s=await getDoc(doc(db,'groupSecrets',id));if(!d.exists())return;const g=d.data(),secret=s.exists()?s.data():{};editingGroupId=id;$('formTitle').textContent='Edit Group';$('gName').value=g.name||'';$('gPrice').value=g.price||'';$('gBank').value=g.bankName||'';$('gAccount').value=g.accountNumber||'';$('gAccountName').value=g.accountName||'';$('gWhatsapp').value=secret.whatsappLink||'';$('gImage').value=g.imageUrl||''};
window.saveGroup=async()=>{try{const data={name:$('gName').value.trim(),price:Number($('gPrice').value),bankName:$('gBank').value.trim(),accountNumber:$('gAccount').value.trim(),accountName:$('gAccountName').value.trim(),imageUrl:$('gImage').value.trim(),updatedAt:serverTimestamp()};if(!data.name||!data.price||!data.bankName||!data.accountNumber||!data.accountName||!$('gWhatsapp').value.trim()){show('groupStatus','error','Complete all group fields.');return}let id=editingGroupId;if(id){await setDoc(doc(db,'groups',id),data,{merge:true});await setDoc(doc(db,'groupSecrets',id),{whatsappLink:$('gWhatsapp').value.trim(),updatedAt:serverTimestamp()},{merge:true})}else{const newRef=doc(collection(db,'groups'));data.createdAt=serverTimestamp();await setDoc(newRef,data);await setDoc(doc(db,'groupSecrets',newRef.id),{whatsappLink:$('gWhatsapp').value.trim(),createdAt:serverTimestamp()})}show('groupStatus','success','Group saved.');resetGroupForm();await loadGroups();await loadAdminGroups()}catch(e){show('groupStatus','error',e.message||'Could not save group.')}};
window.removeGroup=async id=>{if(!confirm('Delete this group?'))return;try{await deleteDoc(doc(db,'groups',id));await deleteDoc(doc(db,'groupSecrets',id));await loadGroups();await loadAdminGroups()}catch(e){alert(e.message)}};
window.resetGroupForm=()=>{editingGroupId=null;$('formTitle').textContent='Add Group';['gName','gPrice','gBank','gAccount','gAccountName','gWhatsapp','gImage'].forEach(id=>$(id).value='')};
async function loadPayments(){const el=$('paymentsList');try{const snap=await getDocs(query(collection(db,'payments'),orderBy('createdAt','desc'),limit(100)));el.innerHTML='';snap.forEach(d=>{const p=d.data();const div=document.createElement('div');div.className='payment';div.innerHTML=`<b>${esc(p.groupName||p.groupId)}</b> <span class="tag ${esc(p.status||'PENDING')}">${esc(p.status||'PENDING')}</span><div class="small">${esc(p.customerEmail||'')} · ${money(p.amount)} · ${esc(p.paymentReference||'')}</div><div class="small">Created: ${p.createdAt?.toDate?p.createdAt.toDate().toLocaleString():''}</div>`;el.appendChild(div)});if(!el.innerHTML)el.textContent='No payment submissions yet.'}catch(e){el.textContent='Could not load payments: '+e.message}}
window.adminLogin=async()=>{try{await signInWithEmailAndPassword(auth,$('adminEmail').value.trim(),$('adminPassword').value);show('loginStatus','success','Login successful.')}catch(e){show('loginStatus','error',e.message)}};window.adminLogout=()=>signOut(auth);window.closeAdmin=()=>{$('adminModal').style.display='none'};$('adminOpen').onclick=()=>{$('adminModal').style.display='block'};
onAuthStateChanged(auth,async user=>{if(user){$('loginArea').classList.add('hidden');$('adminArea').classList.remove('hidden');await loadAdminGroups();await loadPayments()}else{$('loginArea').classList.remove('hidden');$('adminArea').classList.add('hidden')}});
loadGroups();
</script></body></html>
