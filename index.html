<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Groups</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f6;
    color:#17221d;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

header{
    background:#075e54;
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{
    color:#25d366;
}

.admin-btn{
    background:white;
    color:#075e54;
    border:0;
    border-radius:20px;
    padding:8px 14px;
    font-weight:bold;
}

.hero{
    background:#075e54;
    color:white;
    padding:25px 16px 35px;
    text-align:center;
}

.hero h1{
    font-size:28px;
    margin-bottom:8px;
}

.hero p{
    opacity:.9;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px 15px 60px;
}

.groups-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:22px;
}

.group-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.group-image{
    width:100%;
    aspect-ratio:9/10;
    object-fit:cover;
    display:block;
    background:#e9eeee;
}

.group-content{
    padding:18px;
}

.group-name{
    font-size:21px;
    font-weight:800;
    margin-bottom:8px;
}

.price{
    font-size:23px;
    font-weight:800;
    color:#075e54;
    margin-bottom:16px;
}

.bank-box{
    background:#f1f6f4;
    border-radius:12px;
    padding:14px;
    margin-bottom:17px;
}

.bank-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin:6px 0;
    font-size:14px;
}

.bank-label{
    color:#68736e;
}

.bank-value{
    font-weight:bold;
    text-align:right;
    word-break:break-word;
}

.receipt-label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

.receipt-input{
    width:100%;
    padding:11px;
    border:1px solid #d8dfdc;
    border-radius:10px;
    background:#fafafa;
}

.preview{
    display:none;
    width:100%;
    max-height:220px;
    object-fit:contain;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

.verify-btn{
    width:100%;
    border:0;
    background:#25d366;
    color:white;
    padding:13px;
    border-radius:10px;
    font-weight:800;
    margin-top:14px;
}

.verify-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.status{
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    font-size:14px;
    display:none;
}

.status.pending{
    display:block;
    background:#fff7df;
    color:#856404;
}

.status.success{
    display:block;
    background:#e5f8ed;
    color:#087443;
}

.status.failed{
    display:block;
    background:#fde8e8;
    color:#a51d1d;
}

.join-btn{
    display:block;
    width:100%;
    background:#075e54;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:13px;
    border-radius:10px;
    margin-top:12px;
    font-weight:800;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#68736e;
}

/* ADMIN */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:100;
    overflow:auto;
    padding:20px;
}

.modal-box{
    background:white;
    width:100%;
    max-width:900px;
    margin:20px auto;
    border-radius:18px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    font-size:20px;
}

.login-box{
    max-width:400px;
    margin:100px auto;
    background:white;
    border-radius:18px;
    padding:25px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #d5ddda;
    border-radius:9px;
}

.primary-btn{
    width:100%;
    border:0;
    background:#075e54;
    color:white;
    padding:13px;
    border-radius:9px;
    font-weight:bold;
}

.admin-actions{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.admin-actions button{
    border:0;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
}

.add-btn{
    background:#25d366;
    color:white;
}

.logout-btn{
    background:#eee;
}

.group-admin{
    border:1px solid #e1e6e4;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
}

.group-admin-top{
    display:flex;
    gap:12px;
    align-items:center;
}

.group-admin-img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
}

.group-admin-info{
    flex:1;
}

.group-admin-info h3{
    margin-bottom:5px;
}

.admin-buttons{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.admin-buttons button{
    border:0;
    padding:8px 11px;
    border-radius:7px;
    font-size:13px;
}

.edit-btn{
    background:#e9f2ff;
    color:#1256a3;
}

.delete-btn{
    background:#ffe8e8;
    color:#a51d1d;
}

.payment-list{
    margin-top:25px;
}

.payment-item{
    border:1px solid #e1e6e4;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
}

.payment-status{
    font-weight:bold;
    margin-top:6px;
}

.pending-text{
    color:#9a7200;
}

.verified-text{
    color:#087443;
}

.failed-text{
    color:#a51d1d;
}

.receipt-link{
    display:inline-block;
    margin-top:8px;
    color:#075e54;
    font-weight:bold;
}

@media(max-width:600px){
    .groups-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:24px;
    }

    .group-image{
        aspect-ratio:9/10;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">Whats<span>Groups</span></div>
        <button class="admin-btn" onclick="openAdmin()">Admin</button>
    </div>
</header>

<section class="hero">
    <h1>Join Our WhatsApp Groups</h1>
    <p>Choose a group, make payment and get instant access after verification.</p>
</section>

<main class="container">
    <div id="groupsGrid" class="groups-grid"></div>
</main>


<!-- ADMIN MODAL -->

<div id="adminModal" class="modal">

    <div id="loginScreen" class="login-box">

        <div class="modal-header">
            <h2>Admin Login</h2>
            <button class="close" onclick="closeAdmin()">×</button>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="adminEmail" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required>
            </div>

            <button class="primary-btn">
                Login
            </button>

        </form>

        <div id="loginError" class="status failed"></div>

    </div>


    <div id="dashboard" class="modal-box" style="display:none">

        <div class="modal-header">
            <h2>Admin Dashboard</h2>
            <button class="close" onclick="closeAdmin()">×</button>
        </div>

        <div class="admin-actions">
            <button class="add-btn" onclick="showGroupForm()">
                + Add WhatsApp Group
            </button>

            <button class="logout-btn" onclick="logoutAdmin()">
                Logout
            </button>
        </div>

        <div id="groupFormContainer"></div>

        <h3>WhatsApp Groups</h3>

        <div id="adminGroups"></div>

        <div class="payment-list">

            <h3>Payment Submissions</h3>

            <div id="paymentsList"></div>

        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* ============================================================
   REPLACE THESE VALUES WITH YOUR FIREBASE CONFIGURATION
   ============================================================ */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "YOUR_PROJECT.firebaseapp.com",

    projectId: "YOUR_PROJECT_ID",

    storageBucket: "YOUR_PROJECT.appspot.com",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


/* ============================================================
   FIREBASE INITIALIZATION
   ============================================================ */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


/* ============================================================
   GLOBAL VARIABLES
   ============================================================ */

let currentUser = null;

let editingGroupId = null;


/* ============================================================
   ADMIN MODAL
   ============================================================ */

window.openAdmin = function(){

    document.getElementById("adminModal").style.display = "block";

    if(currentUser){

        showDashboard();

    }else{

        document.getElementById("loginScreen").style.display = "block";

        document.getElementById("dashboard").style.display = "none";

    }

};


window.closeAdmin = function(){

    document.getElementById("adminModal").style.display = "none";

};


/* ============================================================
   AUTH STATE
   ============================================================ */

onAuthStateChanged(auth,(user)=>{

    currentUser = user;

});


/* ============================================================
   ADMIN LOGIN
   ============================================================ */

document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const email =
        document.getElementById("adminEmail").value.trim();

    const password =
        document.getElementById("adminPassword").value;

    const errorBox =
        document.getElementById("loginError");

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        errorBox.style.display = "none";

        showDashboard();

    }catch(error){

        errorBox.textContent =
            "Login failed. Check your email and password.";

        errorBox.className =
            "status failed";

    }

});


/* ============================================================
   SHOW DASHBOARD
   ============================================================ */

async function showDashboard(){

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("dashboard").style.display = "block";

    await loadAdminGroups();

    await loadPayments();

}


/* ============================================================
   LOGOUT
   ============================================================ */

window.logoutAdmin = async function(){

    await signOut(auth);

    currentUser = null;

    closeAdmin();

};


/* ============================================================
   LOAD GROUPS
   ============================================================ */

async function loadGroups(){

    const grid =
        document.getElementById("groupsGrid");

    grid.innerHTML = "";

    const snapshot =
        await getDocs(collection(db,"groups"));

    if(snapshot.empty){

        grid.innerHTML = `
            <div class="empty">
                No WhatsApp groups available yet.
            </div>
        `;

        return;

    }

    snapshot.forEach((docSnap)=>{

        const group =
            docSnap.data();

        const card =
            createGroupCard(
                docSnap.id,
                group
            );

        grid.appendChild(card);

    });

}


/* ============================================================
   CREATE CUSTOMER GROUP CARD
   ============================================================ */

function createGroupCard(id,group){

    const card =
        document.createElement("div");

    card.className = "group-card";

    card.innerHTML = `

        <img
            class="group-image"
            src="${escapeHtml(group.imageUrl || "")}"
            alt="${escapeHtml(group.name || "WhatsApp Group")}"
        >

        <div class="group-content">

            <div class="group-name">
                ${escapeHtml(group.name || "WhatsApp Group")}
            </div>

            <div class="price">
                ₦${Number(group.price || 0).toLocaleString()}
            </div>

            <div class="bank-box">

                <div class="bank-row">
                    <span class="bank-label">Bank</span>
                    <span class="bank-value">
                        ${escapeHtml(group.bankName || "")}
                    </span>
                </div>

                <div class="bank-row">
                    <span class="bank-label">Account Number</span>
                    <span class="bank-value">
                        ${escapeHtml(group.accountNumber || "")}
                    </span>
                </div>

                <div class="bank-row">
                    <span class="bank-label">Account Name</span>
                    <span class="bank-value">
                        ${escapeHtml(group.accountName || "")}
                    </span>
                </div>

            </div>

            <label class="receipt-label">
                Upload payment receipt
            </label>

            <input
                type="file"
                class="receipt-input"
                accept="image/*"
            >

            <img class="preview">

            <button class="verify-btn">
                Submit Receipt
            </button>

            <div class="status"></div>

        </div>
    `;


    const input =
        card.querySelector(".receipt-input");

    const preview =
        card.querySelector(".preview");

    const button =
        card.querySelector(".verify-btn");

    const status =
        card.querySelector(".status");


    input.addEventListener("change",()=>{

        const file = input.files[0];

        if(!file) return;

        if(file.size > 5 * 1024 * 1024){

            alert("Receipt must be smaller than 5MB.");

            input.value = "";

            return;

        }

        preview.src =
            URL.createObjectURL(file);

        preview.style.display = "block";

    });


    button.addEventListener("click",async()=>{

        const file = input.files[0];

        if(!file){

            alert("Please upload your payment receipt.");

            return;

        }


        button.disabled = true;

        button.textContent = "Uploading...";

        status.className = "status pending";

        status.textContent =
            "Uploading your receipt...";


        try{

            const filename =
                Date.now() + "_" + file.name;

            const receiptRef =
                ref(
                    storage,
                    `paymentReceipts/${id}/${filename}`
                );


            await uploadBytes(
                receiptRef,
                file
            );


            const receiptUrl =
                await getDownloadURL(receiptRef);


            const paymentRef =
                await addDoc(
                    collection(db,"payments"),
                    {

                        groupId:id,

                        groupName:
                            group.name || "",

                        expectedAmount:
                            Number(group.price || 0),

                        receiptUrl,

                        status:"pending",

                        submittedAt:
                            serverTimestamp()

                    }
                );


            status.className =
                "status pending";

            status.textContent =
                "Receipt submitted successfully. Payment verification is pending.";

            button.textContent =
                "Receipt Submitted";


        }catch(error){

            console.error(error);

            status.className =
                "status failed";

            status.textContent =
                "Unable to submit receipt. Please try again.";

            button.disabled = false;

            button.textContent =
                "Submit Receipt";

        }

    });


    return card;

}


/* ============================================================
   ADMIN GROUP FORM
   ============================================================ */

window.showGroupForm = function(group = null,id = null){

    editingGroupId = id;

    const container =
        document.getElementById(
            "groupFormContainer"
        );


    container.innerHTML = `

        <div class="group-admin" style="margin-bottom:25px">

            <h3>
                ${group ? "Edit Group" : "Add WhatsApp Group"}
            </h3>

            <br>

            <div class="form-group">
                <label>Group Name</label>
                <input
                    id="groupName"
                    value="${escapeHtml(group?.name || "")}"
                >
            </div>

            <div class="form-group">
                <label>Price (₦)</label>
                <input
                    id="groupPrice"
                    type="number"
                    value="${group?.price || ""}"
                >
            </div>

            <div class="form-group">
                <label>Bank Name</label>
                <input
                    id="bankName"
                    value="${escapeHtml(group?.bankName || "Moniepoint")}"
                >
            </div>

            <div class="form-group">
                <label>Account Number</label>
                <input
                    id="accountNumber"
                    value="${escapeHtml(group?.accountNumber || "")}"
                >
            </div>

            <div class="form-group">
                <label>Account Name</label>
                <input
                    id="accountName"
                    value="${escapeHtml(group?.accountName || "")}"
                >
            </div>

            <div class="form-group">
                <label>WhatsApp Group Invite Link</label>
                <input
                    id="whatsappLink"
                    type="url"
                    value="${escapeHtml(group?.whatsappLink || "")}"
                    placeholder="https://chat.whatsapp.com/..."
                >
            </div>

            <div class="form-group">

                <label>
                    Group Image
                </label>

                <input
                    id="groupImage"
                    type="file"
                    accept="image/*"
                >

            </div>

            <button
                class="primary-btn"
                onclick="saveGroup()"
            >
                ${group ? "Update Group" : "Save Group"}
            </button>

            <button
                class="primary-btn"
                style="margin-top:8px;background:#777"
                onclick="cancelGroupForm()"
            >
                Cancel
            </button>

        </div>
    `;

};


window.cancelGroupForm = function(){

    editingGroupId = null;

    document.getElementById(
        "groupFormContainer"
    ).innerHTML = "";

};


/* ============================================================
   SAVE GROUP
   ============================================================ */

window.saveGroup = async function(){

    const name =
        document.getElementById("groupName").value.trim();

    const price =
        Number(document.getElementById("groupPrice").value);

    const bankName =
        document.getElementById("bankName").value.trim();

    const accountNumber =
        document.getElementById("accountNumber").value.trim();

    const accountName =
        document.getElementById("accountName").value.trim();

    const whatsappLink =
        document.getElementById("whatsappLink").value.trim();

    const imageFile =
        document.getElementById("groupImage").files[0];


    if(!name || !price || !accountNumber || !accountName){

        alert("Please complete all required fields.");

        return;

    }


    try{

        let imageUrl = "";


        if(editingGroupId){

            const existing =
                await getDoc(
                    doc(
                        db,
                        "groups",
                        editingGroupId
                    )
                );

            imageUrl =
                existing.data()?.imageUrl || "";

        }


        if(imageFile){

            const imageRef =
                ref(
                    storage,
                    `groupImages/${Date.now()}_${imageFile.name}`
                );

            await uploadBytes(
                imageRef,
                imageFile
            );

            imageUrl =
                await getDownloadURL(imageRef);

        }


        const groupData = {

            name,

            price,

            bankName,

            accountNumber,

            accountName,

            whatsappLink,

            imageUrl,

            updatedAt:
                serverTimestamp()

        };


        if(editingGroupId){

            await updateDoc(
                doc(
                    db,
                    "groups",
                    editingGroupId
                ),
                groupData
            );

            alert("Group updated successfully.");

        }else{

            await addDoc(
                collection(db,"groups"),
                {

                    ...groupData,

                    createdAt:
                        serverTimestamp()

                }
            );

            alert("Group added successfully.");

        }


        cancelGroupForm();

        await loadGroups();

        await loadAdminGroups();


    }catch(error){

        console.error(error);

        alert(
            "Unable to save group: " +
            error.message
        );

    }

};


/* ============================================================
   ADMIN GROUP LIST
   ============================================================ */

async function loadAdminGroups(){

    const container =
        document.getElementById(
            "adminGroups"
        );

    container.innerHTML = "";

    const snapshot =
        await getDocs(
            collection(db,"groups")
        );


    snapshot.forEach((docSnap)=>{

        const group =
            docSnap.data();

        const div =
            document.createElement("div");

        div.className =
            "group-admin";


        div.innerHTML = `

            <div class="group-admin-top">

                <img
                    class="group-admin-img"
                    src="${escapeHtml(group.imageUrl || "")}"
                >

                <div class="group-admin-info">

                    <h3>
                        ${escapeHtml(group.name || "")}
                    </h3>

                    <div>
                        ₦${Number(group.price || 0).toLocaleString()}
                    </div>

                    <div class="admin-buttons">

                        <button
                            class="edit-btn"
                            onclick="editGroup('${docSnap.id}')"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteGroup('${docSnap.id}')"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            </div>

        `;

        container.appendChild(div);

    });

}


/* ============================================================
   EDIT GROUP
   ============================================================ */

window.editGroup = async function(id){

    const snap =
        await getDoc(
            doc(db,"groups",id)
        );

    if(!snap.exists()) return;

    showGroupForm(
        snap.data(),
        id
    );

};


/* ============================================================
   DELETE GROUP
   ============================================================ */

window.deleteGroup = async function(id){

    if(!confirm(
        "Delete this WhatsApp group?"
    )) return;


    await deleteDoc(
        doc(db,"groups",id)
    );


    await loadGroups();

    await loadAdminGroups();

};


/* ============================================================
   LOAD PAYMENTS
   ============================================================ */

async function loadPayments(){

    const container =
        document.getElementById(
            "paymentsList"
        );

    container.innerHTML = "";

    const snapshot =
        await getDocs(
            collection(db,"payments")
        );


    if(snapshot.empty){

        container.innerHTML =
            "<p>No payment submissions yet.</p>";

        return;

    }


    snapshot.forEach((docSnap)=>{

        const payment =
            docSnap.data();


        const div =
            document.createElement("div");

        div.className =
            "payment-item";


        div.innerHTML = `

            <strong>
                ${escapeHtml(payment.groupName || "")}
            </strong>

            <div>
                Expected:
                ₦${Number(payment.expectedAmount || 0).toLocaleString()}
            </div>

            <div class="payment-status ${

                payment.status === "verified"
                    ? "verified-text"
                    :
                payment.status === "failed"
                    ? "failed-text"
                    :
                    "pending-text"

            }">

                Status:
                ${escapeHtml(payment.status || "pending")}

            </div>

            ${
                payment.receiptUrl
                ?
                `<a
                    class="receipt-link"
                    href="${escapeHtml(payment.receiptUrl)}"
                    target="_blank"
                >
                    View Receipt
                </a>`
                :
                ""
            }

            ${
                payment.status === "pending"
                ?
                `
                <div class="admin-buttons">

                    <button
                        class="edit-btn"
                        onclick="setPaymentStatus('${docSnap.id}','verified')"
                    >
                        Mark Verified
                    </button>

                    <button
                        class="delete-btn"
                        onclick="setPaymentStatus('${docSnap.id}','failed')"
                    >
                        Mark Failed
                    </button>

                </div>
                `
                :
                ""
            }

        `;


        container.appendChild(div);

    });

}


/* ============================================================
   MANUAL PAYMENT STATUS
   ============================================================ */

window.setPaymentStatus = async function(
    paymentId,
    status
){

    await updateDoc(
        doc(
            db,
            "payments",
            paymentId
        ),
        {

            status,

            verifiedAt:
                status === "verified"
                    ? serverTimestamp()
                    : null

        }
    );


    await loadPayments();

};


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

loadGroups();

</script>
